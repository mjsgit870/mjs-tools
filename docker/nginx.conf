server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets -> cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Entry point / unfingerprinted files -> always revalidate
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /favicon.svg {
        add_header Cache-Control "no-cache";
    }
}
